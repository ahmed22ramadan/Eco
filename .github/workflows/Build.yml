name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate native Android project
        run: flutter create --org com.robabikya --project-name robabikya --platforms=android .

      - name: Prepare signing key from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
            cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
            echo "تم تجهيز مفتاح التوقيع الرسمي."
          else
            echo "مفيش KEYSTORE_BASE64 في الأسرار - هيتم البناء بتوقيع debug مؤقت."
          fi

      - name: Copy Firebase config into place
        run: cp google-services.json android/app/google-services.json

      - name: Patch Android project (permissions, name, Firebase plugin)
        run: python3 scripts/patch_android.py

      - name: Get packages
        run: flutter pub get

      - name: Generate app icon
        run: dart run flutter_launcher_icons

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: robabikya-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Build release App Bundle (AAB)
        run: flutter build appbundle --release

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: robabikya-aab
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Publish public download link
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
